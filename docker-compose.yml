version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegisvote-db
    environment:
      POSTGRES_DB: secure_voting_db
      POSTGRES_USER: subscribly_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_demo_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed_demo_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscribly_user -d secure_voting_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegisvote-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: secure_voting_db
      DB_USER: subscribly_user
      DB_PASSWORD: ${DB_PASSWORD:-secure_demo_password_2026}
      JWT_SECRET: ${JWT_SECRET:-production_hmac_secret_key_change_me_in_prod}
      RECEIPT_SECRET: ${RECEIPT_SECRET:-production_ballot_receipt_salt_2026}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
